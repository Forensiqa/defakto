name: Build and Test Distribution

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          enable-cache: "false"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls defakto-*.whl)
          python -m pip install "${WHEEL}"

      # Runs outside the source tree, so it checks the installed package, not the repo.
      - name: Smoke test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          defakto --version
          python -c "import defakto; print(defakto.__version__)"
          defakto analyze --help
