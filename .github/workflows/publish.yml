name: Publish to PyPI

# Push a tag like v0.1.0 to publish that version to PyPI.
# No token is stored: PyPI trusts this workflow directly (trusted publishing).
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No cache in the release workflow, so a poisoned cache can't reach a published build.
      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          enable-cache: "false"

      - name: Check the tag matches the package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      - name: Build distributions
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  # Separate job: only this one may request PyPI credentials, so nothing run during
  # the build can get hold of them.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
